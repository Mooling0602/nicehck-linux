[workspace]
resolver = "2"
members = [
    "crates/nicehck-protocol",
    "crates/nicehck-cli",
    "crates/nicehck-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
nicehck-protocol = { path = "crates/nicehck-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
egui_plot = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
